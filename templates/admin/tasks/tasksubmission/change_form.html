{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if original %}
  <div class="submit-row">
    <a href="{% url 'admin:tasks_tasksubmission_export_trial_csv' original.pk %}"
       class="button"
       style="background: #417690; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; margin-right: 8px;">
      Download trial CSV
    </a>
    <a href="{% url 'admin:tasks_tasksubmission_export_raw_csv' original.pk %}"
       class="button"
       style="background: #79aec8; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">
      Download raw CSV
    </a>
  </div>
  {% endif %}
{% endblock %}
